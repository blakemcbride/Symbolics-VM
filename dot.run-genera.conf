# Sample settings for run-genera.sh.
# Copy this file to run-genera.conf in this directory and adjust it.
# It is read by bash: NAME=value, no spaces around the "=".
# Every line is optional; the values shown are the defaults.

# Directory that nfs2d.py serves to Genera as "/".  It must contain an
# entry named cdrom (a symbolic link will do) leading to the directory
# that holds sys.sct.  See NETWORKING, section 3.
NFSROOT=/srv/genera

# yes lets Genera create and change files below NFSROOT.  Needed to
# define a site (see Setup.md).  Takes effect when the server is next
# started:  sudo systemctl stop genera-nfs2d
NFSRW=no

# The tap device, the host's address on it, and the prefix length.
# These must agree with the genera.network line in .VLM.
TAPDEV=tap0
HOSTADDR=10.0.0.1
PREFIX=24
